<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>图片尺寸标注工具</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--p:#7c3aed;--pd:#5b21b6;--pl:#f5f3ff;--bg:#fafaf9;--card:#fff;--t:#1c1917;--tl:#78716c;--bd:#e7e5e4;}
body{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t);min-height:100vh;}
.bar{position:fixed;top:0;left:0;right:0;height:48px;background:linear-gradient(90deg,var(--p),var(--pd));color:#fff;display:flex;align-items:center;padding:0 16px;z-index:999;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.12);}
.bar b{font-size:16px;}
.bar span{font-size:11px;opacity:.65;border-left:1px solid rgba(255,255,255,.25);padding-left:8px;}
.main{padding:60px 16px 32px;max-width:960px;margin:0 auto;}
.up{border:2px dashed #d6d3d1;border-radius:14px;padding:44px 16px;text-align:center;cursor:pointer;background:var(--card);transition:.2s;}
.up:hover{border-color:var(--p);background:var(--pl);}
.up i{font-size:40px;display:block;margin-bottom:8px;}
.up h3{font-size:15px;font-weight:600;}
.up p{font-size:12px;color:var(--tl);margin-top:4px;}
.ws{display:none;gap:14px;align-items:flex-start;}
.ws.on{display:flex;}
.cv{flex:1;background:var(--card);border-radius:12px;padding:12px;border:1px solid var(--bd);}
.cv canvas{width:100%;display:block;border-radius:6px;background:#f5f5f4;touch-action:none;}
.cv .tip{font-size:11px;color:var(--tl);margin-top:8px;}
.sd{width:260px;background:var(--card);border-radius:12px;padding:16px;border:1px solid var(--bd);flex-shrink:0;}
.sd h3{font-size:14px;font-weight:700;margin-bottom:10px;}
.f{margin-bottom:10px;}
.f label{display:block;font-size:11px;font-weight:600;margin-bottom:4px;}
.f input{width:100%;padding:7px 10px;border:1px solid var(--bd);border-radius:8px;font-size:13px;outline:none;}
.f input:focus{border-color:var(--p);box-shadow:0 0 0 2px rgba(124,58,237,.12);}
.ll{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
.lr{display:flex;gap:5px;align-items:center;}
.lr input{flex:1;min-width:0;}
.lr .del{padding:5px 8px;border:1px solid var(--bd);background:#fff;border-radius:6px;cursor:pointer;color:#a8a29e;font-size:12px;}
.lr.act input{border-color:var(--p);box-shadow:0 0 0 2px rgba(124,58,237,.12);}
.btn{display:block;width:100%;padding:8px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:.15s;text-align:center;}
.bp{background:var(--p);color:#fff;margin-bottom:8px;}.bp:hover{background:var(--pd);}
.bg{background:var(--pl);color:var(--p);margin-bottom:8px;}.bg:hover{background:#ede9fe;}
.hint{font-size:10px;color:var(--tl);line-height:1.6;margin-top:8px;border-top:1px solid var(--bd);padding-top:8px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1c1917;color:#fff;padding:10px 18px;border-radius:10px;font-size:12px;z-index:9000;display:none;}
.toast.on{display:block;}
#pm{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:8000;align-items:center;justify-content:center;flex-direction:column;padding:16px;}
#pm.on{display:flex;}
#pm img{max-width:100%;max-height:70vh;border-radius:10px;}
#pm .pt{color:#fff;font-size:12px;margin-top:14px;text-align:center;line-height:1.6;}
#pm .pc{margin-top:12px;padding:7px 20px;border-radius:8px;border:none;background:#fff;color:#1c1917;font-size:13px;font-weight:600;cursor:pointer;}
@media(max-width:720px){.ws{flex-direction:column;}.sd{width:100%;}}
</style>
</head>
<body>
<div class="bar"><b>📐 尺寸标注</b><span>拖线标注 · 长按保存</span></div>
<div class="main">
  <div class="up" id="up">
    <i>🖼️</i>
    <h3>点击或拖拽上传图片</h3>
    <p>JPG / PNG / WebP</p>
    <input type="file" id="fi" accept="image/*" style="display:none">
  </div>
  <div class="ws" id="ws">
    <div class="cv">
      <canvas id="cv"></canvas>
      <div class="tip">点击右侧「＋ 尺寸线」后，在此图上按住拖动绘制</div>
    </div>
    <div class="sd">
      <h3>📏 标注</h3>
      <div class="ll" id="ll"></div>
      <button class="btn bg" id="addL">＋ 尺寸线</button>
      <div class="f"><label>型号（右下角）</label><input type="text" id="mdl" placeholder="如 SKU-A001"></div>
      <button class="btn bp" id="dl">生成并保存图片</button>
      <div class="hint">1. 点「＋尺寸线」→ 图片上拖动<br>2. 右侧填数字，可加多条线<br>3. 填型号→显示在右下角<br>4. 手机：生成后长按图保存</div>
    </div>
  </div>
</div>
<div class="toast" id="tt"></div>
<div id="pm">
  <img id="pi" alt="预览">
  <div class="pt">📱 长按图片保存到相册<br>💻 右键另存为</div>
  <button class="pc" id="px">关闭</button>
</div>
<script>
(function(){
var $=function(id){return document.getElementById(id);};
var img=null,canvas=$('cv'),ctx=null,lines=[],act=-1,drawMode=false,dragType='',mdlText='';
var DPR=window.devicePixelRatio||1;
var ttT;
function toast(m){var t=$('tt');t.textContent=m;t.classList.add('on');clearTimeout(ttT);ttT=setTimeout(function(){t.classList.remove('on');},2000);}

// 上传
$('up').onclick=function(){$('fi').click();};
$('fi').onchange=function(e){if(e.target.files[0])loadImg(e.target.files[0]);};
document.ondragover=function(e){e.preventDefault();};
document.ondrop=function(e){e.preventDefault();if(e.dataTransfer.files[0])loadImg(e.dataTransfer.files[0]);};

function loadImg(f){
  if(!f.type.startsWith('image/'))return;
  var r=new FileReader();
  r.onload=function(ev){
    var im=new Image();
    im.onload=function(){
      img=im;lines=[];act=-1;mdlText='';$('mdl').value='';
      initCanvas();$('ws').classList.add('on');$('up').style.display='none';
      renderList();render();
    };
    im.src=ev.target.result;
  };
  r.readAsDataURL(f);
}

function initCanvas(){
  var mw=Math.min(720,img.width),sc=mw/img.width;
  canvas.width=mw*DPR;canvas.height=img.height*sc*DPR;
  canvas.style.width=mw+'px';canvas.style.height=(img.height*sc)+'px';
  ctx=canvas.getContext('2d');ctx.scale(DPR,DPR);
}

function render(){
  if(!img||!ctx)return;
  var cw=canvas.width/DPR,ch=canvas.height/DPR;
  ctx.clearRect(0,0,cw,ch);ctx.drawImage(img,0,0,cw,ch);
  drawAllLines(ctx,cw,ch);
}

// 箭头
function arrow(c,x,y,a,s){
  c.beginPath();c.moveTo(x,y);
  c.lineTo(x-s*Math.cos(a-0.4),y-s*Math.sin(a-0.4));
  c.lineTo(x-s*Math.cos(a+0.4),y-s*Math.sin(a+0.4));
  c.closePath();c.fill();
}

function drawLine(c,l,w,h){
  var x1=l.x1*w,y1=l.y1*h,x2=l.x2*w,y2=l.y2*h;
  var a=Math.atan2(y2-y1,x2-x1),mx=(x1+x2)/2,my=(y1+y2)/2;
  // 线
  c.strokeStyle='#fff';c.lineWidth=2;c.setLineDash([]);
  c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();
  // 箭头
  c.fillStyle='#fff';arrow(c,x1,y1,a+Math.PI,9);arrow(c,x2,y2,a,9);
  // 数字
  if(l.val!==''){
    c.font='13px sans-serif';c.textAlign='center';c.textBaseline='middle';
    var t=String(l.val),tw=c.measureText(t).width;
    // 沿线的法线方向偏移，任何角度（横/竖/斜）都不压线
    var nx=-Math.sin(a),ny=Math.cos(a);
    if(ny<0){nx=-nx;ny=-ny;}            // 优先偏移到线的上方
    if(Math.abs(ny)<0.12){nx=Math.abs(nx);ny=0;} // 竖线时偏移到右侧
    var lx=mx+nx*22,ly=my+ny*22;
    c.fillStyle='rgba(255,255,255,.9)';c.fillRect(lx-tw/2-5,ly-9,tw+10,18);
    c.strokeStyle='rgba(0,0,0,.1)';c.lineWidth=1;c.strokeRect(lx-tw/2-5,ly-9,tw+10,18);
    c.fillStyle='#1c1917';c.fillText(t,lx,ly);
  }
}

function drawAllLines(c,w,h){
  lines.forEach(function(l){if(!l.pending)drawLine(c,l,w,h);});
  if(drawMode&&act>=0&&lines[act]&&!lines[act].pending)drawLine(c,lines[act],w,h);
  // 型号
  if(mdlText){
    c.font='bold 30px sans-serif';c.textAlign='right';c.textBaseline='middle';
    var mt='型号: '+mdlText,tw=c.measureText(mt).width;
    var mx=w-14,my=h-21;
    c.fillStyle='rgba(255,255,255,.95)';c.fillRect(mx-tw-12,my-21,tw+12,42);
    c.strokeStyle='rgba(0,0,0,.15)';c.lineWidth=1.5;c.strokeRect(mx-tw-12,my-21,tw+12,42);
    c.fillStyle='#1c1917';c.fillText(mt,mx-4,my);
  }
}

// 线列表
function renderList(){
  var el=$('ll');el.innerHTML='';
  lines.forEach(function(l,i){
    var d=document.createElement('div');d.className='lr'+(i===act?' act':'');
    d.innerHTML='<input type="number" step="any" placeholder="尺寸" value="'+(l.val||'')+'"><span class="del">✕</span>';
    d.querySelector('input').oninput=function(){l.val=this.value;render();};
    d.querySelector('.del').onclick=function(){lines.splice(i,1);if(act>=lines.length)act=-1;renderList();render();};
    d.querySelector('input').onfocus=function(){act=i;markActive();};
    el.appendChild(d);
  });
}
function markActive(){
  var rows=$('ll').children;
  for(var i=0;i<rows.length;i++){rows[i].className='lr'+(i===act?' act':'');}
}

$('addL').onclick=function(){
  drawMode=true;act=lines.length;
  lines.push({x1:0,y1:0,x2:0,y2:0,val:'',pending:true});
  renderList();render();toast('在图片上按住拖动绘制');
};

// 坐标
function cpos(e){var r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};}
function tpos(e){var t=e.touches[0]||e.changedTouches[0];var r=canvas.getBoundingClientRect();return{x:(t.clientX-r.left)/r.width,y:(t.clientY-r.top)/r.height};}

// 鼠标
canvas.onmousedown=function(e){
  if(!drawMode||act<0)return;
  var p=cpos(e);lines[act].x1=p.x;lines[act].y1=p.y;lines[act].x2=p.x;lines[act].y2=p.y;
  lines[act].pending=false;
  dragType='line';e.preventDefault();
};
canvas.onmousemove=function(e){
  if(dragType!=='line')return;
  var p=cpos(e);lines[act].x2=clamp(p.x);lines[act].y2=clamp(p.y);render();
};
canvas.onmouseup=function(){if(dragType==='line'){dragType='';drawMode=false;render();}};
canvas.onmouseleave=function(){if(dragType==='line'){dragType='';drawMode=false;render();}};

// 触摸
canvas.ontouchstart=function(e){
  if(!drawMode||act<0)return;e.preventDefault();
  var p=tpos(e);lines[act].x1=p.x;lines[act].y1=p.y;lines[act].x2=p.x;lines[act].y2=p.y;
  lines[act].pending=false;
  dragType='line';
};
canvas.ontouchmove=function(e){
  if(dragType!=='line')return;e.preventDefault();
  var p=tpos(e);lines[act].x2=clamp(p.x);lines[act].y2=clamp(p.y);render();
};
canvas.ontouchend=function(){if(dragType==='line'){dragType='';drawMode=false;render();}};

function clamp(v){return Math.max(0,Math.min(1,v));}

// 型号
$('mdl').oninput=function(){mdlText=this.value;render();};

// 下载
$('dl').onclick=function(){
  if(!img)return;
  var dc=document.createElement('canvas');dc.width=img.width;dc.height=img.height;
  var dctx=dc.getContext('2d');dctx.drawImage(img,0,0);
  drawAllLines(dctx,dc.width,dc.height);
  var isMobile=/iPhone|iPad|Android|Mobile/i.test(navigator.userAgent);
  // 用 Blob 下载，避免 data URL 超 2MB 被浏览器拦截
  dc.toBlob(function(blob){
    if(!blob){toast('生成失败，请重试');return;}
    var url=URL.createObjectURL(blob);
    if(isMobile){
      $('pi').src=url;$('pm').classList.add('on');
    }else{
      var a=document.createElement('a');
      a.download='labeled.png';a.href=url;
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(url);},2000);
      toast('已开始下载');
    }
  },'image/png');
};
$('px').onclick=function(){$('pm').classList.remove('on');};

})();
</script>
<script type="text/javascript" src="/accessproxy_statics/h5_fp.js" defer></script>
<script type="text/javascript" src="/accessproxy_statics/wm.js" defer></script>
</body>
</html>
